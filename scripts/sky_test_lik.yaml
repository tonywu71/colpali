# Run the CUDA-gated MaxSim/LIK slow tests on a single Ampere+ GPU.
#
#   sky launch -c colpali-lik-test scripts/sky_test_lik.yaml -y
#   sky logs colpali-lik-test
#   sky down colpali-lik-test -y

name: colpali-lik-test

resources:
  infra: kubernetes
  image_id: docker:nvidia/cuda:12.4.1-runtime-ubuntu22.04
  accelerators: L4:1
  cpus: 8+

workdir: .

setup: |
  set -eux
  cd ~/sky_workdir
  apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
  curl -LsSf https://astral.sh/uv/install.sh | sh
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  uv venv --python 3.11 .venv
  source .venv/bin/activate
  uv pip install -e ".[kernels,dev]"

run: |
  set -euxo pipefail
  cd ~/sky_workdir
  export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
  source .venv/bin/activate

  python -c "import torch; print('GPU:', torch.cuda.get_device_name()); print('torch:', torch.__version__); print('capability:', torch.cuda.get_device_capability())"
  python -c "import late_interaction_kernels as lik; print('LIK:', lik.__version__ if hasattr(lik, '__version__') else 'installed')"

  pytest -m slow tests/utils/test_maxsim_cuda.py -v
